[build-system]
requires = [
    "hatchling>=1.31",
    "hatch-vcs>=0.5",
]
build-backend = "hatchling.build"


[project]
name = "schafkopfrl"
dynamic = ["version"]
description = "Reinforcement learning for Schafkopf: game engine, gymnasium environment, and training utilities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ivo Nikolic", email = "Ivo.Nikolic@outlook.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3.11",

    "Programming Language :: Python :: 3.12",

    "Programming Language :: Python :: 3.13",

    "Programming Language :: Python :: 3.14",

    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4",
    "gymnasium",
    "jinja2",
    "numpy",
    "pandas",
    "rich",
    "stable-baselines3",
    "tensorboard",
    "torch",
    "tqdm",
]

[project.scripts]
schafkopf = "schafkopfrl.schafkopfengine.main:cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/schafkopfrl"]

[dependency-groups]
test = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "pytest-html>=4.1",
    "pytest-mock>=3.14",
    "pytest-reportlog>=1.0",
    "pytest-xdist>=3.8",

    "pytest-datadir>=1.8",

]

package-check = [
    "check-wheel-contents>=0.6.3,<0.7",
    "twine>=6.2,<8",
]

lint = [
    "format-docstring>=0.4,<0.5",
    "mypy>=1.17",
    "types-PyYAML>=6.0",
    "pytest>=8.4",
    "nbstripout==0.9.1",
    "pre-commit>=4.6",
    "ruff>=0.15",
    "types-tqdm>=4.70.0.20260906",
]

notebooks = [
    "ipykernel>=6",
    "jupyterlab>=4",
]

docs = [
    "furo>=2025.7",
    "myst-parser>=4",

    "myst-nb>=1.3",


    "pylint>=3.3",  # provides pylint.pyreverse (used for UML generation)
    "sphinxcontrib-mermaid>=2,<3",


    "sphinx>=8",
    "sphinx-copybutton>=0.5",
    "sphinx-inline-tabs>=2023.4",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "package-check" },


    { include-group = "notebooks" },


    { include-group = "docs" },

    "tox>=4.44",
    "tox-uv>=1.35",
    "pytest-sugar>=1.1",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.pytest.ini_options]
required_plugins = [
    "pytest-cov>=6.2",
    "pytest-html>=4.1",
    "pytest-mock>=3.14",
    "pytest-reportlog>=1.0",
    "pytest-xdist>=3.8",

    "pytest-datadir>=1.8",

]
addopts = """
-ra
--strict-config
--strict-markers
--cov=schafkopfrl
--cov-context=test
--cov-report=term-missing
--cov-report=html:reports/coverage/html
--cov-report=xml:reports/coverage/coverage.xml
--cov-report=json:reports/coverage/coverage.json
--html=reports/pytest/report.html
--self-contained-html
--report-log=reports/pytest/report.jsonl
"""
testpaths = ["tests"]
log_cli = false
log_file = "reports/pytest/logs/pytest.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%dT%H:%M:%S"

[tool.coverage.run]
source = ["schafkopfrl"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "reports/coverage/html"
show_contexts = true
skip_empty = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
show_error_code_links = true

# Strict stays on for src/ + scripts/. Test fixtures and doubles are commonly
# declared unannotated or partially annotated. `strict` requires one annotation
# per def, so we relax only the "every def must be annotated" family for the
# tests package — bare generics, Any-typed locals, and subclass checks are
# still enforced, so the override is small and auditable.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.format_docstring]
line_length = 121
docstring_style = "google"
fix_rst_backticks = true
include_arg_types = false
include_arg_defaults = false
include_return_and_yield_types = false
exclude = "\\.git|\\.venv|\\.tox|__pycache__|build|dist|reports"

[tool.ruff]
target-version = "py311"
line-length = 121
force-exclude = true
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "docs/_build",
    "reports",
]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "D",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "G",
    "I",

    "ICN",

    "LOG",

    "NPY",

    "PTH",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
]
ignore = [
    "ANN401",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]
"docs/source/conf.py" = ["D100"]
"scripts/**/*.py" = ["S603", "S607", "T201"]
"src/**/main.py" = ["T201"]


"notebooks/**/*.ipynb" = ["ANN", "D", "E402", "S101", "T20"]
"docs/source/notebooks/**/*.ipynb" = ["ANN", "D", "E402", "S101", "T20"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
